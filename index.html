<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JazTimer Countdown</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.png" type="image/png" />
    <style>
        :root {
            --overlay: rgba(15, 23, 42, 0.45);
            --panel: rgba(15, 23, 42, 0.42);
            --text: #f8fafc;
            --button-bg: rgba(15, 23, 42, 0.72);
            --button-text: #f8fafc;
            --button-border: rgba(255, 255, 255, 0.22);
            --shadow: rgba(15, 23, 42, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            font-family: "Segoe UI", sans-serif;
            color: var(--text);
            background: #0f172a;
            position: fixed;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: scale(1.05) rotate(0deg);
            transform-origin: center center;
            filter: saturate(1.1);
            transition: transform 0.25s ease, background-size 0.25s ease;
            z-index: 0;
        }

        .background.landscape-image {
            background-size: cover;
            transform: rotate(90deg) scale(1.16);
        }

        .background.portrait-image {
            background-size: cover;
            transform: scale(1.02) rotate(0deg);
        }

        @media (max-width: 768px) {
            .background {
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;
                transform: scale(1.02) rotate(0deg);
            }
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(15, 23, 42, 0.18), rgba(15, 23, 42, 0.6));
            width: 100%;
            height: 100%;
        }

        .countdown-panel {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 32px 24px;
            border-radius: 28px;
            background: transparent;
            backdrop-filter: none;
            box-shadow: none;
            border: 0;
        }

        .eyebrow {
            margin: 0 0 8px;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.9;
            text-shadow: 0 2px 8px rgba(15, 23, 42, 0.8);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.6rem);
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(15, 23, 42, 0.8);
        }

        .days-block {
            margin-top: 18px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        #daysRemaining {
            display: block;
            font-size: clamp(4rem, 12vw, 9rem);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -0.07em;
            text-shadow: 0 3px 12px rgba(15, 23, 42, 0.85);
        }

        .label {
            font-size: clamp(1.1rem, 2vw, 1.8rem);
            font-weight: 600;
            opacity: 0.95;
            text-shadow: 0 2px 8px rgba(15, 23, 42, 0.8);
        }

        .image-menu {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.35);
        }

        .image-menu.hidden {
            display: none;
        }

        .menu-card {
            width: min(90vw, 360px);
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.4);
            padding: 20px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-card h2 {
            margin: 0;
            font-size: 1.2rem;
            text-align: center;
        }

        .menu-card button {
            width: 100%;
            border: 1px solid var(--button-border);
            background: var(--button-bg);
            color: var(--button-text);
            border-radius: 12px;
            font: inherit;
            padding: 12px 16px;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .menu-card button:active {
            transform: translateY(1px);
        }

        .menu-card button.secondary {
            background: rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 540px) {
            .countdown-panel {
                width: min(88vw, 420px);
                padding: 24px 18px;
            }
        }
    </style>
</head>

<body>
    <div id="background" class="background" aria-hidden="true"></div>

    <main class="countdown-panel" aria-live="polite">
        <p class="eyebrow">Countdown to</p>
        <h1 id="targetDateLabel">February 12, 2027</h1>
        <div class="days-block">
            <span id="daysRemaining">0</span>
            <span class="label">days</span>
        </div>
    </main>

    <div id="imageMenu" class="image-menu hidden" role="dialog" aria-modal="true" aria-labelledby="imageMenuTitle">
        <div class="menu-card">
            <h2 id="imageMenuTitle">Background image</h2>
            <button id="chooseImageBtn" type="button">Choose custom picture</button>
            <button id="resetImageBtn" class="secondary" type="button">Reset to default picture</button>
            <button id="cancelImageBtn" class="secondary" type="button">Cancel</button>
            <input id="imagePicker" type="file" accept="image/*" hidden />
        </div>
    </div>

    <script>
        const TARGET_DATE = new Date('2027-02-12T00:00:00');
        const DAY_MS = 24 * 60 * 60 * 1000;
        const STORAGE_KEY = 'jaztimer.customBackground';
        const DEFAULT_BACKGROUND = './JazTimerBackground.png';

        const backgroundEl = document.getElementById('background');
        const daysRemainingEl = document.getElementById('daysRemaining');
        const targetDateLabelEl = document.getElementById('targetDateLabel');
        const imageMenuEl = document.getElementById('imageMenu');
        const imagePickerEl = document.getElementById('imagePicker');
        const chooseImageBtn = document.getElementById('chooseImageBtn');
        const resetImageBtn = document.getElementById('resetImageBtn');
        const cancelImageBtn = document.getElementById('cancelImageBtn');

        let currentBackgroundUrl = DEFAULT_BACKGROUND;
        let longPressTimer = null;

        function getSavedBackground() {
            try {
                return localStorage.getItem(STORAGE_KEY) || '';
            } catch (error) {
                return '';
            }
        }

        function updateBackgroundOrientation(imageUrl) {
            const image = new Image();
            image.onload = () => {
                const isLandscapeImage = image.naturalWidth > image.naturalHeight;

                backgroundEl.classList.toggle('landscape-image', isLandscapeImage);
                backgroundEl.classList.toggle('portrait-image', !isLandscapeImage);
            };
            image.src = imageUrl;
        }

        function setBackground(imageUrl) {
            currentBackgroundUrl = imageUrl;
            backgroundEl.style.backgroundImage = `url("${imageUrl}")`;
            updateBackgroundOrientation(imageUrl);
        }

        function applyBackground() {
            const savedBackground = getSavedBackground();
            setBackground(savedBackground || DEFAULT_BACKGROUND);
        }

        function saveBackground(imageDataUrl) {
            try {
                localStorage.setItem(STORAGE_KEY, imageDataUrl);
            } catch (error) {
                console.warn('Could not save custom background:', error);
            }
        }

        function clearSavedBackground() {
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (error) {
                console.warn('Could not clear custom background:', error);
            }
        }

        function updateTargetLabel() {
            targetDateLabelEl.textContent = new Intl.DateTimeFormat('en-US', {
                month: 'long',
                day: 'numeric',
                year: 'numeric'
            }).format(TARGET_DATE);
        }

        function updateCountdown() {
            const diffMs = TARGET_DATE.getTime() - Date.now();
            const daysLeft = diffMs <= 0 ? 0 : Math.ceil(diffMs / DAY_MS);
            daysRemainingEl.textContent = String(daysLeft);
        }

        function openImageMenu() {
            imageMenuEl.classList.remove('hidden');
        }

        function closeImageMenu() {
            imageMenuEl.classList.add('hidden');
        }

        function loadSelectedImage(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                const dataUrl = String(reader.result || '');
                if (dataUrl) {
                    saveBackground(dataUrl);
                    setBackground(dataUrl);
                }
                closeImageMenu();
                imagePickerEl.value = '';
            };
            reader.readAsDataURL(file);
        }

        function startLongPress(event) {
            if (event.target.closest('button') || event.target.closest('input')) {
                return;
            }

            longPressTimer = window.setTimeout(() => {
                openImageMenu();
            }, 600);
        }

        function cancelLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        window.addEventListener('resize', () => {
            updateBackgroundOrientation(currentBackgroundUrl);
        });

        window.addEventListener('orientationchange', () => {
            updateBackgroundOrientation(currentBackgroundUrl);
        });

        chooseImageBtn.addEventListener('click', () => {
            imagePickerEl.click();
            closeImageMenu();
        });

        resetImageBtn.addEventListener('click', () => {
            clearSavedBackground();
            setBackground(DEFAULT_BACKGROUND);
            closeImageMenu();
        });

        cancelImageBtn.addEventListener('click', closeImageMenu);
        imageMenuEl.addEventListener('click', (event) => {
            if (event.target === imageMenuEl) {
                closeImageMenu();
            }
        });
        imagePickerEl.addEventListener('change', loadSelectedImage);

        document.addEventListener('contextmenu', (event) => {
            if (event.target.closest('button') || event.target.closest('input')) {
                return;
            }
            event.preventDefault();
            openImageMenu();
        });

        document.addEventListener('pointerdown', startLongPress);
        document.addEventListener('pointerup', cancelLongPress);
        document.addEventListener('pointerleave', cancelLongPress);
        document.addEventListener('pointercancel', cancelLongPress);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./serviceworker.js').catch((error) => {
                    console.warn('Service worker registration failed:', error);
                });
            });
        }

        updateTargetLabel();
        applyBackground();
        updateCountdown();
        setInterval(updateCountdown, 60 * 1000);
    </script>
</body>

</html>
